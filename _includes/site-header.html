<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ '/about/' | relative_url }}" aria-label="pasha.log, about">
      <span class="brand-name">pasha.log</span>
      <span class="brand-mark" aria-hidden="true">&gt; λ</span>
    </a>
    <div class="header-actions">
      <nav class="site-nav" aria-label="Main navigation">
        {% for item in site.data.navigation.main %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
