<!doctype html>
<html lang="{{ site.locale | default: 'en-US' }}" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f4f0e8">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = saved || preferred;
      }());
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body class="page-{{ page.layout | default: 'default' }}">
    <a class="skip-link" href="#content">Skip to content</a>
    {% include site-header.html %}
    <main id="content">
      {{ content }}
    </main>
    {% include site-footer.html %}
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  </body>
</html>
