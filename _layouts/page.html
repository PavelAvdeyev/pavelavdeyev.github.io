---
layout: default
---
<article class="page-shell{% if page.hide_heading %} page-shell-no-heading{% endif %}{% if page.page_class %} {{ page.page_class }}{% endif %}">
  {% unless page.hide_heading %}
  <header class="page-heading{% if page.compact_title %} compact-heading{% endif %}">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
  </header>
  {% endunless %}
  <div class="prose">
    {{ content }}
  </div>
</article>
